<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a1628"/>
  <!-- Amber glow top-right -->
  <radialGradient id="g1" cx="85%" cy="15%" r="50%" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#F9A825" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <!-- Teal glow bottom-left -->
  <radialGradient id="g2" cx="10%" cy="85%" r="40%" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0D7377" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <!-- Decorative circle -->
  <circle cx="980" cy="130" r="240" fill="none" stroke="#F9A825" stroke-width="1" opacity="0.07"/>
  <circle cx="980" cy="130" r="380" fill="none" stroke="#F9A825" stroke-width="1" opacity="0.04"/>
  <!-- Logo text: UpGyaan -->
  <text x="80" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="52" fill="#ffffff">Up<tspan fill="#F9A825">Gyaan</tspan></text>
  <!-- Divider line -->
  <line x1="80" y1="140" x2="320" y2="140" stroke="#F9A825" stroke-width="2" opacity="0.6"/>
  <!-- Tagline -->
  <text x="80" y="175" font-family="'Inter', sans-serif" font-weight="400" font-size="22" fill="rgba(255,255,255,0.55)" letter-spacing="0.04em">LEARN. EVOLVE. THRIVE.</text>
  <!-- Main headline -->
  <text x="80" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="62" fill="#ffffff">Your career in tech</text>
  <text x="80" y="378" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="62" fill="#ffffff">deserves more than luck.</text>
  <!-- Sub -->
  <text x="80" y="450" font-family="'Inter', sans-serif" font-weight="400" font-size="26" fill="rgba(255,255,255,0.68)">A community for tech professionals who want to</text>
  <text x="80" y="490" font-family="'Inter', sans-serif" font-weight="400" font-size="26" fill="rgba(255,255,255,0.68)">grow with intention.</text>
  <!-- URL -->
  <text x="80" y="580" font-family="'Inter', sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.35)">upgyaan.com</text>
</svg>
