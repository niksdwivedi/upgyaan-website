<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why Mentorship in Corporate Tech Is Broken">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D3B45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#14a1a6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Teal accent bar -->
  <rect x="80" y="80" width="6" height="80" rx="3" fill="#0D7377"/>

  <!-- Decorative circle -->
  <circle cx="1050" cy="150" r="180" fill="#0D7377" opacity="0.07"/>
  <circle cx="1050" cy="150" r="120" fill="#0D7377" opacity="0.07"/>

  <!-- Tag -->
  <rect x="92" y="80" width="140" height="32" rx="6" fill="#0D7377" fill-opacity="0.25" stroke="#0D7377" stroke-opacity="0.5" stroke-width="1"/>
  <text x="162" y="101" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#4dd6db" text-anchor="middle" letter-spacing="0.05em">MENTORSHIP</text>

  <!-- Headline line 1 -->
  <text x="92" y="200" font-family="'Inter', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">Why Mentorship in</text>
  <!-- Headline line 2 -->
  <text x="92" y="268" font-family="'Inter', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">Corporate Tech Is</text>
  <!-- Headline line 3 — amber highlight -->
  <text x="92" y="336" font-family="'Inter', sans-serif" font-size="52" font-weight="700" fill="#F9A825" letter-spacing="-0.02em">Broken</text>

  <!-- Divider -->
  <rect x="92" y="370" width="600" height="1" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Description -->
  <text x="92" y="410" font-family="'Inter', sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.65" letter-spacing="0">The mentorship you receive in corporate tech is almost always</text>
  <text x="92" y="440" font-family="'Inter', sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.65">designed to serve the company, not you.</text>

  <!-- Author / brand row -->
  <circle cx="112" cy="530" r="18" fill="#0D7377"/>
  <text x="112" y="536" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ND</text>
  <text x="140" y="527" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.9">Nikhil Dwivedi</text>
  <text x="140" y="547" font-family="'Inter', sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.45">upgyaan.com</text>

</svg>
