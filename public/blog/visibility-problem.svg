<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Visibility Problem: Why Great Work Alone Won't Get You Promoted">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#061020"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.06" fill="#ffffff">
    <circle cx="120" cy="120" r="2"/> <circle cx="240" cy="120" r="2"/> <circle cx="360" cy="120" r="2"/> <circle cx="480" cy="120" r="2"/> <circle cx="600" cy="120" r="2"/> <circle cx="720" cy="120" r="2"/> <circle cx="840" cy="120" r="2"/> <circle cx="960" cy="120" r="2"/> <circle cx="1080" cy="120" r="2"/>
    <circle cx="120" cy="240" r="2"/> <circle cx="240" cy="240" r="2"/> <circle cx="360" cy="240" r="2"/> <circle cx="480" cy="240" r="2"/> <circle cx="600" cy="240" r="2"/> <circle cx="720" cy="240" r="2"/> <circle cx="840" cy="240" r="2"/> <circle cx="960" cy="240" r="2"/> <circle cx="1080" cy="240" r="2"/>
    <circle cx="120" cy="360" r="2"/> <circle cx="240" cy="360" r="2"/> <circle cx="360" cy="360" r="2"/> <circle cx="480" cy="360" r="2"/> <circle cx="600" cy="360" r="2"/> <circle cx="720" cy="360" r="2"/> <circle cx="840" cy="360" r="2"/> <circle cx="960" cy="360" r="2"/> <circle cx="1080" cy="360" r="2"/>
    <circle cx="120" cy="480" r="2"/> <circle cx="240" cy="480" r="2"/> <circle cx="360" cy="480" r="2"/> <circle cx="480" cy="480" r="2"/> <circle cx="600" cy="480" r="2"/> <circle cx="720" cy="480" r="2"/> <circle cx="840" cy="480" r="2"/> <circle cx="960" cy="480" r="2"/> <circle cx="1080" cy="480" r="2"/>
  </g>

  <!-- Glowing amber orb top-right -->
  <circle cx="1100" cy="100" r="200" fill="#F9A825" opacity="0.05"/>
  <circle cx="1100" cy="100" r="120" fill="#F9A825" opacity="0.06"/>

  <!-- Amber accent bar -->
  <rect x="80" y="80" width="6" height="80" rx="3" fill="#F9A825"/>

  <!-- Tag -->
  <rect x="92" y="80" width="148" height="32" rx="6" fill="#F9A825" fill-opacity="0.15" stroke="#F9A825" stroke-opacity="0.4" stroke-width="1"/>
  <text x="166" y="101" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F9A825" text-anchor="middle" letter-spacing="0.05em">CAREER GROWTH</text>

  <!-- Headline -->
  <text x="92" y="200" font-family="'Inter', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">The Visibility</text>
  <text x="92" y="268" font-family="'Inter', sans-serif" font-size="52" font-weight="700" fill="#F9A825" letter-spacing="-0.02em">Problem</text>

  <!-- Sub-headline -->
  <text x="92" y="338" font-family="'Inter', sans-serif" font-size="30" font-weight="500" fill="#ffffff" fill-opacity="0.55" letter-spacing="-0.01em">Why Great Work Alone Won't</text>
  <text x="92" y="376" font-family="'Inter', sans-serif" font-size="30" font-weight="500" fill="#ffffff" fill-opacity="0.55" letter-spacing="-0.01em">Get You Promoted</text>

  <!-- Divider -->
  <rect x="92" y="415" width="600" height="1" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Description -->
  <text x="92" y="452" font-family="'Inter', sans-serif" font-size="19" fill="#ffffff" fill-opacity="0.55">In corporate tech, doing excellent work is necessary —</text>
  <text x="92" y="480" font-family="'Inter', sans-serif" font-size="19" fill="#ffffff" fill-opacity="0.55">but not sufficient for career advancement.</text>

  <!-- Author row -->
  <circle cx="112" cy="555" r="18" fill="#0D7377"/>
  <text x="112" y="561" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ND</text>
  <text x="140" y="551" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.9">Nikhil Dwivedi</text>
  <text x="140" y="571" font-family="'Inter', sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.45">upgyaan.com</text>

</svg>
